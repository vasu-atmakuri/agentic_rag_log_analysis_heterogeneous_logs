# Experiment matrix for the 14-inch MacBook Pro (Apple M5 Pro, 48 GB). All Qwen3-4B experiments run here so
# that ablations are paired with a main run from the same machine. The earlier M1 run of experiment 1 is kept
# in experiment_results/ as a cross-hardware reproducibility check.
# Frozen experiment matrix. Experiments run in the order listed (highest priority first).
# Every experiment uses the same decoding settings; only the factor named in its title changes.
datasets_config: configs/benchmark_datasets.yaml
benchmark_dir: benchmark_questions_frozen
artifacts_dir: experiment_artifacts
results_dir: experiment_results_m5_pro_48gb
expert_prompts_dir: configs/expert_system_prompts

runtime:
  num_ctx: 8192
  temperature: 0.0
  seed: 42
  keep_alive: 2m
  max_output_tokens: 768
  max_output_tokens_thinking: 2048

all_methods: &all_methods [bm25_line_retrieval, long_context_uniform, fixed_size_chunk_rag, multi_type_chunk_rag, tool_using_agent]
system_methods: &system_methods [multi_type_chunk_rag, tool_using_agent]

experiments:
  # 1. Main comparison, primary model (about 840 runs)
  - name: main_comparison__qwen3_4b_instruct
    model: qwen3:4b-instruct-2507-q4_K_M
    datasets: all
    methods: *all_methods
    characterization: automatic
    thinking: false

  # 2. Characterization ablation: generic prompts, no noisy-logger filtering (about 336 runs)
  - name: characterization_ablation_generic_prompts__qwen3_4b_instruct
    model: qwen3:4b-instruct-2507-q4_K_M
    datasets: all
    methods: *system_methods
    characterization: generic
    thinking: false

  # 3. Characterization ablation: hand-written expert prompts (about 336 runs)
  #    Requires configs/expert_system_prompts/<dataset>.yaml to be written first (no TODO left).
  - name: characterization_ablation_expert_prompts__qwen3_4b_instruct
    model: qwen3:4b-instruct-2507-q4_K_M
    datasets: all
    methods: *system_methods
    characterization: expert
    thinking: false

  # 4. Second model family, same matrix as experiment 1 (about 840 runs)
  - name: main_comparison__llama3_2_3b
    model: llama3.2:3b
    datasets: all
    methods: *all_methods
    characterization: automatic
    thinking: false

  # 5. Chunk-type ablations on the fault-injected testbed (4 x about 140 runs)
  - name: chunk_ablation_without_time_window__qwen3_4b_instruct
    model: qwen3:4b-instruct-2507-q4_K_M
    datasets: [fault_injected_inference_service]
    methods: *system_methods
    characterization: automatic
    excluded_chunk_types: [time_window]
  - name: chunk_ablation_without_error_burst__qwen3_4b_instruct
    model: qwen3:4b-instruct-2507-q4_K_M
    datasets: [fault_injected_inference_service]
    methods: *system_methods
    characterization: automatic
    excluded_chunk_types: [error_burst]
  - name: chunk_ablation_without_logger_thread__qwen3_4b_instruct
    model: qwen3:4b-instruct-2507-q4_K_M
    datasets: [fault_injected_inference_service]
    methods: *system_methods
    characterization: automatic
    excluded_chunk_types: [logger_thread]
  - name: chunk_ablation_without_init_sequence__qwen3_4b_instruct
    model: qwen3:4b-instruct-2507-q4_K_M
    datasets: [fault_injected_inference_service]
    methods: *system_methods
    characterization: automatic
    excluded_chunk_types: [init_sequence]

  # 6. Model scale and family (added 2026-11-01 before any run on this machine). Same questions, code and
  #    decoding settings as experiment 1. A candidate enters only if its development smoke test shows the
  #    required answer format and at least one tool call by the agent.
  - name: main_comparison__qwen3_30b_a3b_instruct
    model: qwen3:30b-a3b-instruct-2507-q4_K_M
    datasets: all
    methods: *all_methods
    characterization: automatic
    thinking: false
  - name: main_comparison__mistral_small_3_2_24b
    model: mistral-small3.2:24b
    datasets: all
    methods: *all_methods
    characterization: automatic
    thinking: false
  - name: main_comparison__llama3_1_8b
    model: llama3.1:8b
    datasets: all
    methods: *all_methods
    characterization: automatic
    thinking: false
