# Benchmark definition. Paths are relative to the project root.
seed: 20261101
benchmark_output_dir: benchmark_questions_frozen

datasets:
  fault_injected_inference_service:
    reader: fault_injected_testbed
    log_path: log_datasets/fault_injected_inference_service/fault_injected_inference_service.log
    ground_truth_manifest: log_datasets/fault_injected_inference_service/fault_injected_inference_service_ground_truth.json
    time_style: iso
    level_classes: [ERROR, WARN, CRITICAL]
    keyword_classes: []
    window_hours: [1, 2, 3]
    include_precedence_causal: false
    questions_per_category: {factual: 18, temporal: 18, comparative: 16, causal: 18}
    dev_questions: 8

  zookeeper:
    reader: zookeeper
    log_path: log_datasets/loghub_zookeeper/Zookeeper.log
    time_style: iso
    level_classes: [ERROR, WARN]
    keyword_classes: []
    window_hours: [1, 2, 3]
    questions_per_category: {factual: 12, temporal: 14, comparative: 12, causal: 12}
    dev_questions: 8

  linux_syslog:
    reader: linux_syslog
    log_path: log_datasets/loghub_linux/Linux.log
    base_year: 2005
    time_style: syslog
    level_classes: []
    keyword_classes: ["authentication failure", "session opened", "connection from", "exited abnormally", "check pass; user unknown"]
    window_hours: [6, 12, 24]
    questions_per_category: {factual: 12, temporal: 14, comparative: 12, causal: 12}
    dev_questions: 8
